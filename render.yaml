services:
  - type: web
    name: candidarc-job-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm install --include=dev --prefix client && npm install --prefix server && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DATABASE_SSL
        value: "true"
